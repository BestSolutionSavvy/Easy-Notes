openapi: 3.0.3
info:
  title: Easy Notes API
  version: 1.0.0
  description: API for managing a SPA for notes on PDF.
servers:
- url: http://localhost:3000
paths:
  /notebooks:
    get:
      summary: List of all notebooks
      responses:
        "200":
          description: List of notebooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notebook"
    post:
      summary: Add a new notebook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notebook"
      responses:
        "201":
          description: Notebook added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "400":
          description: Invalid notebook data
  /notebooks/{username}/{id}:
    get:
      summary: Details of a specific notebook for a user
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Notebook found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "404":
          description: Notebook not found
    post:
      summary: Create or update a notebook
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notebook"
      responses:
        "200":
          description: Notebook created or updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "400":
          description: Invalid notebook data
    delete:
      summary: Delete a notebook
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Notebook deleted successfully (no content)
        "404":
          description: Notebook not found
  /notes/{notebookId}:
    get:
      summary: Get all notes for a specific notebook
      parameters:
      - in: path
        name: notebookId
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: List of notes for the notebook
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "404":
          description: Notebook not found
    post:
      summary: Add a new note to a specific notebook
      parameters:
      - in: path
        name: notebookId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Note"
      responses:
        "201":
          description: Note added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: Invalid note data
  /notes/{notebookId}/{noteId}:
    delete:
      summary: Delete a specific note
      parameters:
      - in: path
        name: notebookId
        required: true
        schema:
          type: integer
      - in: path
        name: noteId
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Note deleted successfully (no content)
        "404":
          description: Note not found
  /classes:
    get:
      summary: Get list of all classes
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Classes"
        "404":
          description: No classes found
    post:
      summary: Add a new class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Classes"
      responses:
        "201":
          description: Class added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classes"
        "400":
          description: Invalid class data
  /classes/{id}:
    delete:
      summary: Delete a specific class
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Class deleted successfully (no content)
        "404":
          description: Class not found
  /pdf/{classesId}:
    get:
      summary: Get all PDF for a specific class
      parameters:
      - in: path
        name: classesId
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: List of PDFs for the class
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PDF"
        "404":
          description: Class not found
    post:
      summary: Add a new PDF to a specific class
      parameters:
      - in: path
        name: classesId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PDF"
      responses:
        "201":
          description: PDF added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PDF"
        "400":
          description: Invalid PDF data
        "404":
          description: Class not found
  /pdf/{classesId}/{pdfId}:
    delete:
      summary: Delete a specific PDF
      parameters:
      - in: path
        name: classesId
        required: true
        schema:
          type: integer
      - in: path
        name: pdfId
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: PDF deleted successfully (no content)
        "404":
          description: PDF not found
  /users:
    get:
      summary: Get the informations of a specific user
      parameters:
      - in: query
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        "404":
          description: User not found
    put:
      summary: Update the informations of a specific user
      parameters:
      - in: query
        name: username
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        "400":
          description: Weak password
        "409":
          description: Username already exists
        "404":
          description: User not found
    delete:
      summary: Delete a specific user
      parameters:
      - in: query
        name: username
        required: true
        schema:
          type: string
      responses:
        "204":
          description: User deleted successfully (no content)
        "404":
          description: User not found
  /users/login:
    post:
      summary: Verify user credentials (login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  example: "user123"
                password:
                  type: string
                  example: "securepassword"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login successful"
                  user:
                    $ref: '#/components/schemas/UserInfo'
        "401":
          description: Invalid credentials
        "400":
          description: Missing username or password
  /users/signup:
    post:
      summary: Create a new user (signup)
      parameters:
      - in: query
        name: role
        required: true
        schema:
          $ref: '#/components/schemas/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        "400":
          description: Weak password
        "409":
          description: Username already exists

components:
  schemas:
    Notebook:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "user123"
        subject:
          type: string
          example: "ASW"
        date:
          type: string
          format: date
          example: "2024-10-01"
        last_page:
          type: integer
          example: 15
    Note:
      type: object
      required:
      - id
      - notebookId
      properties:
        id:
          type: integer
          example: 1
        notebookId:
          type: integer
          example: 1
        content:
          type: string
          example: "This is a note content."
    Classes:
      type: object
      properties:
        id:
          type: integer
          example: 1
        teacher:
          type: string
          example: "Dr. Smith"
        name:
          type: string
          example: "ASW"
    PDF:
      type: object
      properties:
        id:
          type: integer
          example: 1
        classesId:
          type: integer
          example: 1
        title:
          type: string
          example: "Lecture Notes"
        url:
          type: string
          example: "http://example.com/lecture-notes.pdf"
    User:
      type: object
      required:
      - username
      - password
      - role
      properties:
        username:
          type: string
          example: "User123"
        name:
          type: string
          example: "John"
        surname:
          type: string
          example: "Doe"
        password:
          type: string
          example: "securepassword"
        role:
          $ref: '#/components/schemas/UserRole'
    UserRole:
      type: string
      enum:
      - student
      - teacher
      example: student
    UserInfo:
      type: object
      properties:
        username:
          type: string
          example: "user123"
        name:
          type: string
          example: "John"
        surname:
          type: string
          example: "Doe"
        role:
          $ref: '#/components/schemas/UserRole'
