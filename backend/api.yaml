openapi: 3.0.3
info:
  title: Easy Notes API
  version: 1.0.0
  description: API for managing a SPA for notes on PDF.
servers:
  - url: http://localhost:3000/api
paths:
  /notebooks/{email}:
    get:
      summary: List of all notebooks of a specific user
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of notebooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notebook"
    post:
      summary: Add a new notebook
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notebook"
      responses:
        "201":
          description: Notebook added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "400":
          description: Invalid notebook data
  /notebooks/{email}/{id}:
    get:
      summary: Details of a specific notebook for a user
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notebook found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "404":
          description: Notebook not found
    post:
      summary: Create or update a notebook
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notebook"
      responses:
        "200":
          description: Notebook created or updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "400":
          description: Invalid notebook data
    delete:
      summary: Delete a notebook
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Notebook deleted successfully (no content)
        "404":
          description: Notebook not found
  /classes:
    get:
      summary: Get list of all classes
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Classes"
        "404":
          description: No classes found
    post:
      summary: Add a new class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Classes"
      responses:
        "201":
          description: Class added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classes"
        "400":
          description: Invalid class data
  /classes/{id}:
    delete:
      summary: Delete a specific class
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Class deleted successfully (no content)
        "404":
          description: Class not found
  /users/{email}:
    get:
      summary: Get the informations of a specific user
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            example: "user@example.com"
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "404":
          description: User not found
    put:
      summary: Update the informations of a specific user
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            example: "user@example.com"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "400":
          description: Weak password
        "404":
          description: User not found
    delete:
      summary: Delete a specific user
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            example: "user@example.com"
      responses:
        "204":
          description: User deleted successfully (no content)
        "404":
          description: User not found
  /users/login:
    post:
      summary: Verify user credentials (login)
      description: Authenticates user and sets an httpOnly cookie with JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: "user@example.com"
                password:
                  type: string
                  example: "securepassword"
      responses:
        "200":
          description: Login successful.
          headers:
            Set-Cookie:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login successful"
                  user:
                    $ref: "#/components/schemas/UserInfo"
        "401":
          description: Invalid credentials
        "400":
          description: Missing email or password
  /users/signup:
    post:
      summary: Create a new user (signup)
      description: Creates new user and sets an httpOnly cookie with JWT token
      parameters:
        - in: query
          name: role
          required: true
          schema:
            $ref: "#/components/schemas/UserRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User created successfully.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Signup successful"
                  user:
                    $ref: "#/components/schemas/UserInfo"
        "400":
          description: Weak password or missing required fields
        "409":
          description: Email already exists
  /users/verify:
    get:
      summary: Verify JWT token from cookie
      description: Validates the authToken cookie and returns user information
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Token valid"
                  user:
                    $ref: "#/components/schemas/UserInfo"
        "401":
          description: Invalid or missing token
        "404":
          description: User not found
  /users/logout:
    post:
      summary: Logout user
      description: Clears the authToken cookie
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"
  /pdfs/upload:
    post:
      summary: Upload a new PDF file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - pdf
                - type
                - owner
              properties:
                pdf:
                  type: string
                  format: binary
                  description: PDF file to upload
                type:
                  type: string
                  enum:
                    - class
                    - note
                  example: "note"
                owner:
                  type: string
                  example: "user@example.com"
                  description: User E-mail
      responses:
        "201":
          description: PDF uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PDFDocument"
        "400":
          description: Invalid file or missing fields
  /pdfs/{id}:
    get:
      summary: Get PDF metadata
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: PDF document ID
      responses:
        "200":
          description: PDF metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PDFDocument"
        "404":
          description: PDF not found
    delete:
      summary: Delete a PDF document
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: PDF document ID
      responses:
        "200":
          description: PDF not deleted it is still referenced by a notebook or class
        "204":
          description: PDF deleted successfully
        "404":
          description: PDF not found
  /pdfs/{id}/download:
    get:
      summary: Download the PDF file
      parameters:
        - in: query
          name: page
          schema:
            type: number
          description: A specific page number to download (optional)
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: PDF document ID
      responses:
        "200":
          description: PDF file download
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: PDF not found
  /pdfs/{id}/upload:
    put:
      summary: Replace PDF file with a new version
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: PDF document ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - pdf
              properties:
                pdf:
                  type: string
                  format: binary
                  description: New PDF file to upload
      responses:
        "200":
          description: PDF file replaced successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PDFDocument"
        "400":
          description: No file uploaded
        "404":
          description: PDF not found
  /pdfs/search:
    get:
      summary: Get all PDFs metadata for a specific owner
      parameters:
        - in: query
          name: owner
          required: true
          schema:
            type: string
            example: "user@example.com"
          description: User E-mail
      responses:
        "200":
          description: List of PDFs of the owner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PDFDocument"
  /summarize/{notebookId}:
    post:
      summary: Summarize provided text
      parameters:
        - in: path
          name: notebookId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Summary generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
        "400":
          description: Invalid input data

components:
  schemas:
    Notebook:
      type: object
      required:
        - name
        - subject
        - owner
        - type
      properties:
        name:
          type: string
          example: "Appunti ASW"
        subject:
          type: string
          example: "ASW"
        date:
          type: string
          format: date-time
          example: "2026-01-01T10:30:00Z"
        owner:
          type: string
          example: "user@example.com"
        type:
          type: string
          example: "slide"
        id_pdf:
          type: string
          example: "pdf_12345"
        last_page:
          type: integer
          default: 0
          example: 5
        num_notebook_pages:
          type: integer
          default: 0
          example: 20
        pages:
          type: array
          items:
            $ref: "#/components/schemas/Page"
    Page:
      type: object
      required:
        - page_number
        - note_content
      properties:
        page_number:
          type: integer
          example: 5
        slide_number:
          type: integer
          example: 5
        note_content:
          type: string
          example: "Contenuto degli appunti della pagina"
        text_boxes:
          type: array
          items:
            $ref: "#/components/schemas/TextBox"
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/Highlight"
    TextBox:
      type: object
      properties:
        left:
          type: number
          example: 100.5
        top:
          type: number
          example: 200.3
        width:
          type: number
          example: 150.0
        height:
          type: number
          example: 50.0
        content:
          type: string
          example: "Testo della casella"
    Highlight:
      type: object
      properties:
        left:
          type: number
          example: 120.5
        top:
          type: number
          example: 180.3
        width:
          type: number
          example: 200.0
        height:
          type: number
          example: 20.0
        content:
          type: string
          example: "Testo evidenziato"
    Classes:
      type: object
      properties:
        id:
          type: integer
          example: 1
        teacher:
          type: string
          example: "Dr. Smith"
        name:
          type: string
          example: "ASW"
        date:
          type: string
          format: date
          example: "2026-01-01"
        pdfs:
          type: array
          items:
            type: string
            example: "507f1f77bcf86cd799439011"
    SummaryResponse:
      type: object
      properties:
        summary:
          type: string
          example: "This is a summarized version of the text."
    User:
      type: object
      required:
        - email
        - password
        - role
      properties:
        email:
          type: string
          example: "user@example.com"
        name:
          type: string
          example: "John"
        surname:
          type: string
          example: "Doe"
        password:
          type: string
          example: "securepassword"
        role:
          $ref: "#/components/schemas/UserRole"
        classes:
          type: array
          items:
            type: string
            example: "507f1f77bcf86cd799439013"
    UserRole:
      type: string
      enum:
        - student
        - teacher
      example: student
    UserInfo:
      type: object
      properties:
        email:
          type: string
          example: "user@example.com"
        name:
          type: string
          example: "John"
        surname:
          type: string
          example: "Doe"
        role:
          $ref: "#/components/schemas/UserRole"
        classes:
          type: array
          items:
            type: string
            example: "507f1f77bcf86cd799439013"
    PDFDocument:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          example: "Lecture 1"
        date:
          type: string
          format: date-time
          example: "2026-01-01T10:30:00Z"
        type:
          type: string
          enum:
            - class
            - note
          example: "note"
        owner:
          type: string
          example: "user@example.com"
          description: User E-mail
        gridFsFileId:
          type: string
          example: "507f1f77bcf86cd799439012"
          description: GridFS file ID
